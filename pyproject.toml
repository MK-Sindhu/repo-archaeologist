[project]
name = "repo-archaeologist"
version = "0.1.0"
description = "LangGraph agent that answers 'why is this code like this?' by following code -> commit -> PR -> issue, with a benchmark."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=1.0",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]

[project.scripts]
arch = "archaeologist.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archaeologist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network / API keys (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
